# 中文脱敏配置模板。
# 先复制为 hosts/<host>/backup.conf，再替换所有尖括号占位符。
# 不要在本文件写入 token、明文 secret、恢复数据或任何私钥。

# 必须与运行时 BACKUP_HOST 完全相同。
CONFIG_HOST_ID="<host-id>"

# 只填写用户提供的 age1... 公钥接收方。
# 私钥由用户离线保管，Agent 不接触。
AGE_RECIPIENT="<user-supplied-age1-public-recipient>"

# 当前检出的本地分支必须与此值相同。支持合法的自定义分支。
BACKUP_BRANCH="<backup-branch>"

# 第一项是唯一 canonical，后续项是 mirrors。
# 这些值是已经通过 git remote add 建立的 remote 名，不是 URL。
BACKUP_REMOTES=(
  "<canonical-remote>"
  "<mirror-remote>"
)

# 每项必须是存在的绝对路径。
# 不能填写本仓库、仓库子路径、仓库祖先、重复路径或符号链接路径。
# 恢复必需的配置与 secret 可以作为源路径收入加密归档。
BACKUP_PATHS=(
  "/absolute/path/to/recovery-critical-file"
  "/absolute/path/to/recovery-critical-directory"
)

# 每个 host 本地保留的完整归档、SHA256、manifest 集合数量。
BACKUP_RETENTION_COUNT="<positive-integer>"

# 等待仓库锁的秒数，必须是 0 到 3600 的规范十进制整数。
BACKUP_LOCK_TIMEOUT="<seconds-0-to-3600>"

# 可选 systemd 配置。先用 BACKUP_INSTALL_DRY_RUN=1 渲染检查。
# 除非确实需要读取受限路径，否则不要选择 root。
# root 模式使用 /usr/local/libexec/local-backup-push-kit/backup-launcher，不让 unit 直接执行仓库脚本。
BACKUP_RUN_USER="<service-user>"
BACKUP_RUN_GROUP="<service-group>"
BACKUP_ON_CALENDAR="<systemd-on-calendar-expression>"

# tar 排除规则不是 secret。按恢复需要审核，不要误排除关键文件。
TAR_EXCLUDES=(
  "--exclude=**/.git"
  "--exclude=**/node_modules"
  "--exclude=**/.cache"
  "--exclude=**/__pycache__"
  "--exclude=**/*.pyc"
  "--exclude=**/*.log"
  "--exclude=**/logs"
  "--exclude=**/*.sock"
)
