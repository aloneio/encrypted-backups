# OCI1 encrypted backup configuration. This file contains no credentials.
CONFIG_HOST_ID="oci1"
AGE_RECIPIENT="age1zm8fkq6wk0j0x40dqwcl6lap9sj0jh0xx8xdvtx49y4sv6s4gftqz440sj"
BACKUP_BRANCH="backup/oci1"
BACKUP_REMOTES=(
  "origin"
  "github"
)
# Prepared OCI1 production controls plus the minimal encrypted backup runtime
# recovery set. Remote PostgreSQL dump artifacts remain out of scope here.
BACKUP_PATHS=(
  "/var/lib/local-backup-snapshots/oci1/grok2api-control"
  "/var/lib/local-backup-snapshots/oci1/newapi-control"
  "/var/lib/local-backup-snapshots/oci1/backup-runtime-recovery"
)
BACKUP_RETENTION_COUNT="3"
BACKUP_LOCK_TIMEOUT="30"
BACKUP_RUN_USER="root"
BACKUP_RUN_GROUP="root"
BACKUP_ON_CALENDAR="daily"
TAR_EXCLUDES=(
  "--exclude=**/.git"
  "--exclude=**/node_modules"
  "--exclude=**/.cache"
  "--exclude=**/__pycache__"
  "--exclude=**/*.pyc"
  "--exclude=**/*.sock"
)
